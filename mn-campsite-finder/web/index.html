<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minnesota Dark Camp Finder</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root {
    --bg: #0b1118; --panel: #111a24; --panel-2: #172331; --line: #243447;
    --text: #e6edf3; --muted: #93a1b0; --accent: #ffb13b; --accent-ink: #1b1204;
    --focus: #7cc4ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 24px; }
  #map { height: 100%; width: 100%; }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .row label { flex: 1; cursor: pointer; }
  .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.18); }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .funnel div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12.5px; padding: 3px 0; }
  .funnel .bar { grid-column: 1 / -1; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .funnel .bar i { display: block; height: 100%; background: var(--accent); }
  .funnel .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sky-leg .row { padding: 2px 0; font-size: 12.5px; }
  .sky-leg .cut { color: var(--accent); font-size: 11px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { margin: 0; }
  #list button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 8px 10px;
    border-radius: 6px; border: 1px solid transparent; }
  #list button:hover { background: var(--panel-2); }
  #list button[aria-current=true] { background: var(--panel-2); border-color: var(--accent); }
  #list .t { font-weight: 600; }
  #list .m { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .msg { padding: 24px; max-width: 560px; }
  .msg code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; font: 13px/1.45 system-ui, sans-serif; min-width: 220px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--muted); font-size: 18px; }
  .pop h3 { margin: 0 0 6px; font-size: 14px; }
  .pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  .pop dt { color: var(--muted); } .pop dd { margin: 0; }
  .pop a { color: var(--accent); }
  .maplibregl-ctrl-group { background: var(--panel); border: 1px solid var(--line); box-shadow: none; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--line); }
  .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-scale { background: rgba(17,26,36,.85); color: var(--muted); border-color: var(--muted); }
  .maplibregl-ctrl-attrib { background: rgba(17,26,36,.85) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #side { order: 2; max-height: 42vh; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Controls">
    <h1>Dark camp finder</h1>
    <p class="sub" id="built">Loading…</p>

    <h2>Layers</h2>
    <div id="layers"></div>
    <div class="row"><input type="checkbox" id="basemap"><label for="basemap">Street basemap (raster tiles, needs internet)</label></div>

    <h2>Why this many hectares</h2>
    <div class="funnel" id="funnel"></div>

    <h2>Night sky bands</h2>
    <div class="sky-leg" id="skyleg"></div>

    <h2 id="listhead">Shortlist</h2>
    <ul id="list"></ul>
    <p class="note" id="listnote"></p>
  </aside>
  <div id="map"></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>
"use strict";
const SKY_RAMP = ["#14226b", "#2b49a6", "#4f86c6", "#d9c24a", "#ef9a3b", "#e2573a", "#c9304f"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " → " + r.status);
  return r.json();
}

function showMissing(err) {
  $("side").innerHTML = '<div class="msg"><h1>No data yet</h1><p>Couldn\'t load <code>data/manifest.json</code>.</p>' +
    '<p>Run <code>python -m campfinder build</code> first, then reload.</p><p class="note">' + esc(err.message) + "</p></div>";
}

function bboxOf(geom) {
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  (function walk(c) {
    if (typeof c[0] === "number") { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); }
    else c.forEach(walk);
  })(geom.coordinates);
  return [[x0, y0], [x1, y1]];
}

function popupNode(title, rows) {
  const d = document.createElement("div"); d.className = "pop";
  const h = document.createElement("h3"); h.textContent = title; d.appendChild(h);
  const dl = document.createElement("dl");
  for (const [k, v] of rows) {
    if (v === null || v === undefined || v === "") continue;
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd");
    if (v instanceof Node) dd.appendChild(v); else dd.textContent = v;
    dl.append(dt, dd);
  }
  d.appendChild(dl);
  return d;
}

(async function main() {
  let manifest;
  try { manifest = await getJSON("data/manifest.json"); } catch (e) { showMissing(e); return; }
  $("built").textContent = "Built " + new Date(manifest.built).toLocaleString();

  const has = (n) => manifest.layers[n] && manifest.layers[n].features > 0;
  const data = {};
  await Promise.all(Object.entries(manifest.layers).map(async ([name, info]) => {
    data[name] = await getJSON("data/" + info.file);
  }));

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 19,
               attribution: "© OpenStreetMap contributors" },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#0b1118" } },
        { id: "osm", type: "raster", source: "osm", layout: { visibility: "none" }, paint: { "raster-opacity": 0.55, "raster-saturation": -0.6 } },
      ],
    },
    bounds: manifest.bounds,
    fitBoundsOptions: { padding: 30 },
    attributionControl: { compact: true },
    maxPitch: 0,
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");

  await new Promise((res) => map.on("load", res));

  for (const [name, fc] of Object.entries(data)) map.addSource(name, { type: "geojson", data: fc, tolerance: 0.2 });

  const L = []; // {id, label, color, layers:[ids], count}
  function add(layer, group) {
    map.addLayer(layer);
    if (group) group.layers.push(layer.id);
  }
  const groups = {};
  const mk = (key, label, color, on = true) => (groups[key] = { key, label, color, layers: [], on });

  if (has("private_land")) {
    const g = mk("private", "Private / not listed as public", "#252b33");
    add({ id: "private-fill", type: "fill", source: "private_land", paint: { "fill-color": "#1b2129", "fill-opacity": 0.9 } }, g);
  }
  if (has("public_land")) {
    const g = mk("public", "Public land (not a result)", "#2f5a43");
    const f = (k) => ["==", ["get", "kind"], k];
    add({ id: "ctx-fill", type: "fill", source: "public_land", filter: f("context"), paint: { "fill-color": "#2f5a43", "fill-opacity": 0.45 } }, g);
    const g2 = mk("campable", "Campable forest land", "#4c9a5f");
    add({ id: "camp-fill", type: "fill", source: "public_land", filter: f("campable"), paint: { "fill-color": "#4c9a5f", "fill-opacity": 0.4 } }, g2);
    add({ id: "camp-line", type: "line", source: "public_land", filter: f("campable"), paint: { "line-color": "#7ac48c", "line-width": 0.8, "line-opacity": 0.6 } }, g2);
    const g3 = mk("excluded", "Excluded (e.g. wilderness)", "#9a4a4a");
    add({ id: "excl-fill", type: "fill", source: "public_land", filter: f("excluded"), paint: { "fill-color": "#9a4a4a", "fill-opacity": 0.4 } }, g3);
  }
  if (has("sky")) {
    const g = mk("sky", "Night-sky brightness bands", "#4f86c6", false);
    add({ id: "sky-fill", type: "fill", source: "sky", layout: { visibility: "none" },
          paint: { "fill-color": ["match", ["get", "band"], ...SKY_RAMP.slice(0, -1).flatMap((c, i) => [i, c]), SKY_RAMP[SKY_RAMP.length - 1]],
                   "fill-opacity": 0.42 } }, g);
  }
  if (has("lakes")) {
    const g = mk("lakes", "Lakes", "#2f77c2");
    add({ id: "lakes-fill", type: "fill", source: "lakes", paint: { "fill-color": "#2f77c2", "fill-opacity": 0.85 } }, g);
    add({ id: "lakes-line", type: "line", source: "lakes", paint: { "line-color": "#7fb8f0", "line-width": 0.8 } }, g);
  }
  if (has("roads")) {
    const g = mk("roads", "Roads and tracks", "#c9a66b");
    const cls = ["get", "highway"];
    const isTrack = ["==", cls, "track"];
    const colour = ["match", cls, ["unclassified", "service", "residential"], "#b9c2cc", ["tertiary", "secondary"], "#e9eef3", ["primary", "trunk", "motorway"], "#ff7a59", "#b9c2cc"];
    const width = (a, b) => ["interpolate", ["linear"], ["zoom"], 8, 0.6, 14, ["match", cls, ["unclassified", "service", "residential"], a, b]];
    // dash patterns cannot be data-driven in MapLibre, so tracks and roads are separate layers
    add({ id: "roads-line", type: "line", source: "roads", filter: ["!", isTrack], layout: { "line-cap": "round" },
          paint: { "line-color": colour, "line-width": width(2, 2.8) } }, g);
    add({ id: "tracks-line", type: "line", source: "roads", filter: isTrack,
          paint: { "line-color": "#c9a66b", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.8, 14, 1.8], "line-dasharray": [2, 1.5] } }, g);
  }
  if (has("candidates")) {
    const g = mk("candidates", "Candidate campsite areas", "#ffb13b");
    add({ id: "cand-fill", type: "fill", source: "candidates", paint: { "fill-color": "#ffb13b", "fill-opacity": 0.8 } }, g);
    add({ id: "cand-line", type: "line", source: "candidates", paint: { "line-color": "#ffd88a", "line-width": 1.4 } }, g);
    map.addLayer({ id: "cand-sel", type: "line", source: "candidates", filter: ["==", ["get", "rank"], -1],
                   paint: { "line-color": "#ffffff", "line-width": 3 } });
  }

  // ---- layer toggles
  const box = $("layers");
  const order = ["candidates", "campable", "public", "excluded", "lakes", "roads", "sky", "private"];
  for (const key of order) {
    const g = groups[key]; if (!g) continue;
    const row = document.createElement("div"); row.className = "row";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "t-" + key; cb.checked = g.on;
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = g.color;
    const lb = document.createElement("label"); lb.htmlFor = cb.id; lb.textContent = g.label;
    row.append(cb, sw, lb);
    const srcName = { candidates: "candidates", lakes: "lakes", roads: "roads", sky: "sky", private: "private_land" }[key];
    if (srcName && manifest.layers[srcName]) {
      const c = document.createElement("span"); c.className = "count"; c.textContent = fmt(manifest.layers[srcName].features);
      row.append(c);
    }
    box.appendChild(row);
    cb.addEventListener("change", () => g.layers.forEach((id) => map.setLayoutProperty(id, "visibility", cb.checked ? "visible" : "none")));
  }
  $("basemap").addEventListener("change", (e) => map.setLayoutProperty("osm", "visibility", e.target.checked ? "visible" : "none"));

  // ---- funnel
  const fun = $("funnel"), top = Math.max(1, ...manifest.funnel.map((s) => s.hectares));
  for (const s of manifest.funnel) {
    const d = document.createElement("div");
    const a = document.createElement("span"); a.textContent = s.step;
    const b = document.createElement("span"); b.className = "n"; b.textContent = fmt(s.hectares) + " ha";
    const bar = document.createElement("div"); bar.className = "bar";
    const i = document.createElement("i"); i.style.width = Math.max(0.5, (100 * s.hectares) / top) + "%"; bar.appendChild(i);
    d.append(a, b, bar); fun.appendChild(d);
  }

  // ---- sky legend
  const leg = $("skyleg"), labels = manifest.sky.labels || [], maxBand = manifest.sky.max_band;
  labels.forEach((lab, i) => {
    const r = document.createElement("div"); r.className = "row";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = SKY_RAMP[Math.min(i, SKY_RAMP.length - 1)];
    const t = document.createElement("span"); t.textContent = lab;
    r.append(sw, t);
    if (i === maxBand) { const c = document.createElement("span"); c.className = "cut"; c.textContent = "← accepted up to here"; r.append(c); }
    leg.appendChild(r);
  });

  // ---- popups
  const popup = new maplibregl.Popup({ closeButton: true, maxWidth: "320px" });
  function candidateNode(p) {
    const link = document.createElement("a"); link.href = p.map_link; link.target = "_blank"; link.rel = "noopener";
    link.textContent = p.lat + ", " + p.lon;
    return popupNode("#" + p.rank + (p.lake_name ? " · " + p.lake_name : ""), [
      ["Land", p.source + (p.unit && p.unit !== p.source ? " – " + p.unit : "")],
      ["Area", fmt(p.area_ha) + " ha"],
      ["Night sky", p.sky_label],
      ["To lake", p.dist_lake_m != null ? fmt(p.dist_lake_m) + " m" : null],
      ["Nearest road", [p.road_class, p.road_name, p.road_surface].filter(Boolean).join(", ") || null],
      ["To road", p.dist_road_m != null ? fmt(p.dist_road_m) + " m" : null],
      ["Point", link],
    ]);
  }
  function select(rank) {
    map.setFilter("cand-sel", ["==", ["get", "rank"], rank]);
    document.querySelectorAll("#list button").forEach((b) => b.setAttribute("aria-current", String(Number(b.dataset.rank) === rank)));
  }
  if (groups.candidates) {
    map.on("click", "cand-fill", (e) => {
      const f = e.features[0]; select(f.properties.rank);
      popup.setLngLat(e.lngLat).setDOMContent(candidateNode(f.properties)).addTo(map);
    });
    map.on("mouseenter", "cand-fill", () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", "cand-fill", () => (map.getCanvas().style.cursor = ""));
  }
  if (groups.lakes) {
    map.on("click", "lakes-fill", (e) => {
      if (groups.candidates && map.queryRenderedFeatures(e.point, { layers: ["cand-fill"] }).length) return;
      const p = e.features[0].properties;
      popup.setLngLat(e.lngLat).setDOMContent(popupNode(p.lake_name || "Lake", [["Area", fmt(p.lake_ha) + " ha"]])).addTo(map);
    });
  }

  // ---- shortlist
  const feats = (data.candidates?.features || []).slice().sort((a, b) => a.properties.rank - b.properties.rank);
  $("listhead").textContent = "Shortlist (" + fmt(feats.length) + " areas)";
  if (!feats.length) {
    $("listnote").textContent = "Nothing survived all criteria. Relax one in config.toml, or run: python -m campfinder build --set criteria.sky.max_band=3";
  } else {
    $("listnote").textContent = feats.length > 60 ? "Showing the best 60. All are in shortlist.csv." : "Ranked by darkness, then distance to lake, then distance to road.";
    for (const f of feats.slice(0, 60)) {
      const p = f.properties, li = document.createElement("li"), b = document.createElement("button");
      b.dataset.rank = p.rank; b.type = "button";
      const t = document.createElement("div"); t.className = "t"; t.textContent = "#" + p.rank + "  " + (p.lake_name || p.unit || p.source);
      const m = document.createElement("div"); m.className = "m";
      m.textContent = [fmt(p.area_ha) + " ha", p.sky_label, p.dist_lake_m != null ? fmt(p.dist_lake_m) + " m to lake" : null].filter(Boolean).join(" · ");
      b.append(t, m); li.appendChild(b); $("list").appendChild(li);
      b.addEventListener("click", () => {
        select(p.rank);
        map.fitBounds(bboxOf(f.geometry), { padding: 80, maxZoom: 14, duration: 600 });
        popup.setLngLat([p.lon, p.lat]).setDOMContent(candidateNode(p)).addTo(map);
      });
    }
  }
})();
</script>
</body>
</html>
